# ═══════════════════════════════════════════════════════════════
#  نبضةٌ من خارج السيرفر — تُصحّيه لا تمنع نومه فقط.
#
#  لماذا هذه إضافةٌ لا بديل: النبضة داخل `server.js` تعيش في العملية
#  نفسها. فحين ينيّم Render الخدمة تتوقّف العملية **وتموت النبضة معها**
#  — تمنع النوم ولا تقدر أن تُصحّي.
#
#  وهذه تعمل على آلة GitHub، مستقلّةً تماماً: تضرب `/api/health` كل
#  خمس دقائق سواء كان صاحياً أو نائماً. فأوّل زبونٍ في الصباح يجد
#  السيرفر جاهزاً بدل أن يكون هو من يوقظه وينتظر ثلاثين ثانية.
#
#  المستودع عامّ ⇒ دقائق Actions **بلا حدّ** — لا تكلفة.
#
#  ⚠️ جدولة GitHub ليست دقيقة: قد تتأخّر التشغيلة دقائق تحت الضغط.
#  ولهذا الفاصل خمسٌ لا عشر — كي يبقى المتوسّط دون مهلة النوم (١٥).
# ═══════════════════════════════════════════════════════════════

name: إيقاظ سيرفر زادنا

on:
  schedule:
    - cron: '*/5 * * * *'
  # زرّ يدوي: بعد كل نشرٍ اضغطه لتوقظه فوراً بدل انتظار الدورة —
  # فلحظة إعادة التشغيل هي الفجوة الوحيدة التي لا تغطّيها الجدولة.
  workflow_dispatch:

# لا نحتاج قراءة الكود ولا كتابته — أقلّ صلاحية ممكنة.
permissions: {}

concurrency:
  # تشغيلةٌ متأخّرة لا تتراكم فوق التي بعدها.
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: نبضة إلى /api/health
        run: |
          URL="https://zadna-server.onrender.com/api/health"

          # `--max-time 60` لأن الإيقاظ من النوم يستغرق ~٣٠ ثانية،
          # والمهلة الافتراضية تقطع الاتصال قبل أن يقوم فيبدو فاشلاً
          # وهو ينهض. ونحاول ثلاثاً: أوّل محاولةٍ بعد نومٍ قد تُقطع.
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 60 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              # نطبع دقائق التشغيل: صفرٌ تقريباً يعني أننا نحن من أيقظه.
              UP=$(grep -o '"uptimeMinutes":[0-9]*' /tmp/out.json | cut -d: -f2)
              echo "✅ حيّ · دقائق التشغيل: ${UP:-؟}"
              exit 0
            fi
            echo "⏳ المحاولة $i ردّت $CODE — ينهض غالباً، ننتظر ١٥ ثانية"
            sleep 15
          done

          # لا نُسقط التشغيلة: فشلٌ عابر يرسل بريد إخفاقٍ لا داعي له،
          # وتكرارُه يجعلك تتجاهل الإخفاقات كلّها — وأخطرها الحقيقي.
          echo "::warning::لم يستجب السيرفر بعد ثلاث محاولات — تحقّق من Render"
